<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GF-Suite Tracker</title>
<meta name="description" content="Vorgangs- und Projektverfolgung nach Jira-Vorbild mit Service-Desk – eigenständige HTML-Version, läuft komplett im Browser.">
<style>
:root {
  --bg: #f7f8f9; --surface: #ffffff; --surface-2: #f1f2f4; --fg: #172b4d; --fg-2: #44546f; --muted: #626f86; --border: #dcdfe4;
  --primary: #0c66e4; --primary-hover: #0055cc; --primary-fg: #fff; --primary-soft: #e9f2ff; --sel: #e9f2ff;
  --todo-bg: #e6e8ec; --todo-fg: #44546f; --prog-bg: #dbe9ff; --prog-fg: #0b5bd0; --done-bg: #d6f5e6; --done-fg: #1a6a45;
  --danger: #c9372c; --danger-soft: #ffeceb; --warn: #8a5b00; --warn-soft: #fff4d6; --ok: #1a6a45; --ok-soft: #dcfff1;
  --s1: #2a78d6; --s2: #eb6834; --ref: #8590a2; --grid: #e6e8ec;
  --nav-h: 56px; --radius: 8px; --shadow: 0 1px 1px rgba(9,30,66,.13), 0 0 1px rgba(9,30,66,.2);
  --shadow-lg: 0 8px 24px rgba(9,30,66,.2), 0 0 1px rgba(9,30,66,.3);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a1d; --surface: #1d2125; --surface-2: #22272b; --fg: #dee4ea; --fg-2: #b6c2cf; --muted: #8c9bab; --border: #343b42;
    --primary: #579dff; --primary-hover: #85b8ff; --primary-fg: #1d2125; --primary-soft: #1c2b41; --sel: #1c2b41;
    --todo-bg: #2c333a; --todo-fg: #b6c2cf; --prog-bg: #12325c; --prog-fg: #85b8ff; --done-bg: #164b35; --done-fg: #7ee2b8;
    --danger: #fd9891; --danger-soft: #42221f; --warn: #f5cd47; --warn-soft: #3a2f13; --ok: #7ee2b8; --ok-soft: #163a2a;
    --s1: #3987e5; --s2: #d95926; --ref: #738496; --grid: #2c333a;
    --shadow: 0 1px 1px rgba(3,4,4,.5), 0 0 1px rgba(3,4,4,.5); --shadow-lg: 0 8px 24px rgba(3,4,4,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a1d; --surface: #1d2125; --surface-2: #22272b; --fg: #dee4ea; --fg-2: #b6c2cf; --muted: #8c9bab; --border: #343b42;
  --primary: #579dff; --primary-hover: #85b8ff; --primary-fg: #1d2125; --primary-soft: #1c2b41; --sel: #1c2b41;
  --todo-bg: #2c333a; --todo-fg: #b6c2cf; --prog-bg: #12325c; --prog-fg: #85b8ff; --done-bg: #164b35; --done-fg: #7ee2b8;
  --danger: #fd9891; --danger-soft: #42221f; --warn: #f5cd47; --warn-soft: #3a2f13; --ok: #7ee2b8; --ok-soft: #163a2a;
  --s1: #3987e5; --s2: #d95926; --ref: #738496; --grid: #2c333a;
  --shadow: 0 1px 1px rgba(3,4,4,.5), 0 0 1px rgba(3,4,4,.5); --shadow-lg: 0 8px 24px rgba(3,4,4,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; } a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; }
/* Top-Navigation */
.topnav { position: sticky; top: 0; z-index: 30; height: var(--nav-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px; padding: 0 12px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); margin-right: 10px; white-space: nowrap; }
.logo .mark { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg, #0c66e4, #6250d6); display: grid; place-items: center; color: #fff; }
.topnav .navlink { padding: 6px 10px; border-radius: 6px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.topnav .navlink:hover { background: var(--surface-2); text-decoration: none; }
.topnav .navlink.on { color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); border-radius: 0; }
.topnav .search { position: relative; margin-left: auto; width: 240px; }
.topnav .search input { padding-left: 30px; height: 34px; }
.topnav .search svg { position: absolute; left: 9px; top: 9px; color: var(--muted); }
.hamb { display: none; }
/* Layout */
.layout { display: flex; min-height: calc(100vh - var(--nav-h)); }
.psidebar { width: 236px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 10px; position: sticky; top: var(--nav-h); height: calc(100vh - var(--nav-h)); overflow-y: auto; }
.psidebar .phead { display: flex; gap: 10px; align-items: center; padding: 0 6px 16px; }
.pavatar { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.psidebar .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 10px 10px 4px; }
.psidebar a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--fg-2); font-weight: 500; }
.psidebar a:hover { background: var(--surface-2); text-decoration: none; }
.psidebar a.on { background: var(--sel); color: var(--primary); }
.content { flex: 1; min-width: 0; padding: 22px 28px 60px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.page-head h1 { font-size: 22px; font-weight: 650; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
/* Bausteine */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 4px; border: 0; background: var(--surface-2); color: var(--fg-2); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(.96); text-decoration: none; }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-hover); filter: none; }
.btn.subtle { background: transparent; } .btn.subtle:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 13px; }
.btn.icon { width: 32px; padding: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
input[type=text], input[type=email], input[type=date], input[type=number], input[type=search], input[type=tel], select, textarea {
  border: 2px solid var(--border); background: var(--surface); border-radius: 4px; padding: 5px 8px; width: 100%; min-width: 0; }
input:hover, select:hover, textarea:hover { background: var(--surface-2); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: var(--surface); }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
textarea { resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--fg-2); }
label.f .req { color: var(--danger); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nowrap { flex-wrap: nowrap; }
.sp { flex: 1; }
.muted { color: var(--muted); } .small { font-size: 12px; } .b { font-weight: 600; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.key { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
a.key:hover { color: var(--primary); }
.lozenge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 5px; border-radius: 3px; line-height: 18px; white-space: nowrap; }
.cat-todo { background: var(--todo-bg); color: var(--todo-fg); } .cat-progress { background: var(--prog-bg); color: var(--prog-fg); } .cat-done { background: var(--done-bg); color: var(--done-fg); }
.tico { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; flex-shrink: 0; }
.tico svg { width: 11px; height: 11px; color: #fff; }
.pico svg { width: 16px; height: 16px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.avatar.lg { width: 32px; height: 32px; font-size: 12px; }
.avatar.none { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; line-height: 18px; white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.chip.gray { background: var(--surface-2); color: var(--fg-2); }
.chip.red { background: var(--danger-soft); color: var(--danger); } .chip.yellow { background: var(--warn-soft); color: var(--warn); } .chip.green { background: var(--ok-soft); color: var(--ok); }
.label-chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--fg-2); font-size: 12px; border-radius: 3px; padding: 0 6px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 2px dashed var(--border); border-radius: 8px; }
.note { padding: 10px 12px; border-radius: 6px; font-size: 13px; }
.note.info { background: var(--primary-soft); color: var(--fg); } .note.warn { background: var(--warn-soft); color: var(--warn); } .note.err { background: var(--danger-soft); color: var(--danger); }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 8px 4px; margin-right: 12px; color: var(--muted); font-weight: 600; cursor: pointer; margin-bottom: -2px; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }
/* Tabellen */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; }
th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--fg); }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--surface-2); }
/* Board */
.board-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.board-tools input[type=search] { width: 200px; }
.avatars-filter { display: flex; }
.avatars-filter button { border: 2px solid var(--surface); border-radius: 50%; padding: 0; margin-left: -5px; cursor: pointer; background: none; }
.avatars-filter button:first-child { margin-left: 0; }
.avatars-filter button.on { border-color: var(--primary); position: relative; z-index: 1; }
.toggle { border: 0; background: transparent; padding: 5px 9px; border-radius: 4px; cursor: pointer; font-weight: 500; color: var(--fg-2); }
.toggle:hover { background: var(--surface-2); } .toggle.on { background: var(--sel); color: var(--primary); }
.board { display: grid; gap: 8px; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: 6px; padding: 8px; min-height: 120px; }
.col.drop-on { background: var(--primary-soft); outline: 2px dashed var(--primary); }
.col-h { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; padding: 4px 6px 10px; display: flex; gap: 6px; }
.lane-h { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 14px 0 6px; font-size: 13px; }
.bcard { background: var(--surface); border-radius: 4px; box-shadow: var(--shadow); padding: 10px; margin-bottom: 6px; cursor: pointer; }
.bcard:hover { background: var(--surface-2); }
.bcard.dragging { opacity: .4; }
.bcard .sum { margin-bottom: 8px; line-height: 1.35; word-break: break-word; }
.pts { background: var(--surface-2); color: var(--fg-2); border-radius: 10px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
/* Backlog */
.sprint-box { background: var(--surface-2); border-radius: 6px; padding: 10px; margin-bottom: 14px; }
.sprint-box.drop-on { outline: 2px dashed var(--primary); background: var(--primary-soft); }
.sprint-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.brow { display: flex; align-items: center; gap: 8px; background: var(--surface); padding: 6px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
.brow:first-child { border-radius: 4px 4px 0 0; } .brow:last-child { border-radius: 0 0 4px 4px; border-bottom: 0; }
.brow:hover { background: var(--sel); }
.brow.drop-before { box-shadow: inset 0 2px 0 var(--primary); }
.brows { box-shadow: var(--shadow); border-radius: 4px; }
.quick-create { display: flex; gap: 6px; margin-top: 6px; }
/* Zeitleiste */
.tl { position: relative; overflow-x: auto; }
.tl-grid { display: grid; grid-template-columns: 260px 1fr; min-width: 900px; }
.tl-name { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; min-width: 0; background: var(--surface); position: sticky; left: 0; z-index: 1; }
.tl-track { position: relative; border-bottom: 1px solid var(--border); height: 38px; }
.tl-bar { position: absolute; top: 9px; height: 20px; border-radius: 4px; cursor: pointer; overflow: hidden; color: #fff; font-size: 11px; font-weight: 600; padding: 0 6px; line-height: 20px; white-space: nowrap; }
.tl-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.28); }
.tl-head { position: relative; height: 30px; border-bottom: 2px solid var(--border); font-size: 11px; color: var(--muted); }
.tl-head span { position: absolute; top: 7px; padding-left: 4px; border-left: 1px solid var(--border); height: 22px; white-space: nowrap; }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--s2); z-index: 0; pointer-events: none; }
/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .cross { stroke: var(--muted); stroke-width: 1; opacity: 0; pointer-events: none; }
.chart g.col-hit:hover .cross { opacity: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 0; vertical-align: 3px; width: 14px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--ref); background: none !important; vertical-align: 3px; width: 14px; }
.hbar { display: grid; grid-template-columns: 140px 1fr 48px; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; }
.hbar .track { height: 14px; }
.hbar .fill { height: 14px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.stack { display: flex; height: 18px; gap: 2px; border-radius: 4px; overflow: hidden; }
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; box-shadow: var(--shadow-lg); display: none; max-width: 260px; white-space: pre-line; }
.stat { padding: 14px 16px; }
.stat .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .l { font-size: 12px; color: var(--muted); }
/* Modal & Vorgang */
.overlay { position: fixed; inset: 0; background: rgba(9,30,66,.54); z-index: 50; display: none; }
.overlay.open { display: block; }
.modal { position: fixed; z-index: 60; left: 50%; top: 40px; transform: translateX(-50%); width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 80px); overflow-y: auto; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-lg); display: none; }
.modal.open { display: block; }
.modal.wide { width: min(1120px, calc(100vw - 24px)); top: 24px; max-height: calc(100vh - 48px); }
.modal-h { display: flex; align-items: center; gap: 8px; padding: 18px 22px 6px; }
.modal-h h2 { font-size: 20px; font-weight: 600; flex: 1; }
.modal-b { padding: 8px 22px 16px; display: grid; gap: 14px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; border-top: 1px solid var(--border); align-items: center; }
.issue-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; padding: 6px 22px 24px; }
.issue-sum { font-size: 22px; font-weight: 600; border: 2px solid transparent; padding: 2px 6px; margin-left: -8px; width: calc(100% + 8px); background: transparent; }
.issue-sum:hover { background: var(--surface-2); }
.sec-title { font-size: 14px; font-weight: 600; margin: 4px 0 8px; display: flex; align-items: center; gap: 8px; }
.desc-view { white-space: pre-wrap; padding: 6px 8px; margin-left: -8px; border-radius: 4px; cursor: text; min-height: 40px; word-break: break-word; }
.desc-view:hover { background: var(--surface-2); }
.details { border: 1px solid var(--border); border-radius: 6px; }
.details .dh { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid var(--border); }
.drow { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 8px; align-items: center; padding: 5px 14px; font-size: 13px; }
.drow > span:first-child { color: var(--muted); font-weight: 600; font-size: 12px; }
.drow select, .drow input { border-color: transparent; padding: 3px 6px; }
.drow select:hover, .drow input:hover { border-color: var(--border); }
.status-btn { font-weight: 700; text-transform: uppercase; font-size: 12px; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.subrow, .linkrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-top: 0; cursor: pointer; background: var(--surface); }
.subrow:first-child, .linkrow:first-child { border-top: 1px solid var(--border); border-radius: 4px 4px 0 0; }
.subrow:last-child, .linkrow:last-child { border-radius: 0 0 4px 4px; }
.subrow:hover, .linkrow:hover { background: var(--surface-2); }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.progress i { display: block; height: 100%; }
.comment { display: flex; gap: 10px; padding: 8px 0; }
.comment .body { flex: 1; min-width: 0; }
.comment .text { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.comment.internal .body { background: var(--warn-soft); border-radius: 6px; padding: 6px 10px; }
.hist { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.mention { color: var(--primary); font-weight: 600; }
/* Popover & Toast */
.pop { position: fixed; top: calc(var(--nav-h) - 4px); right: 12px; width: min(400px, calc(100vw - 24px)); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-lg); z-index: 45; display: none; max-height: 70vh; overflow-y: auto; }
.pop.open { display: block; }
.notif { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notif:hover { background: var(--surface-2); } .notif.unread { background: var(--primary-soft); }
.bell { position: relative; }
.bell .n { position: absolute; top: 0; right: 0; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }
.toasts { position: fixed; left: 20px; bottom: 20px; z-index: 95; display: grid; gap: 8px; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 6px; box-shadow: var(--shadow-lg); font-size: 13px; max-width: 380px; }
/* Portal */
.portal-hero { background: linear-gradient(135deg, #0c66e4, #6250d6); color: #fff; border-radius: 10px; padding: 28px; margin-bottom: 18px; }
.portal-hero h1 { font-size: 24px; }
.rtype { padding: 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; border: 2px solid transparent; }
.rtype:hover, .rtype.on { border-color: var(--primary); }
.rtype .ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
.jql { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.queue-nav button { display: flex; width: 100%; text-align: left; gap: 8px; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--fg-2); font-weight: 500; justify-content: space-between; }
.queue-nav button:hover { background: var(--surface-2); } .queue-nav button.on { background: var(--sel); color: var(--primary); }
.kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .issue-wrap { grid-template-columns: minmax(0,1fr); } .topnav .search { width: 160px; } }

/* ---------- Diagramme (SVG) ---------- */
function lineChart({ labels, series, height = 220, yMax, yLabel = "" }) {

  series.forEach((s) => {

    if (!pts.length) return;
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p.join(",")).join(" ")}"/>`;

    if (!s.dash) g += `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<text x="${last[0] + 8}" y="${last[1] + 4}" style="fill:var(--fg-2)">${esc(s.name)} ${Math.round(lv * 10) / 10}</text>`;
  });
  labels.forEach((lb, k) => {
    const tip = `${lb}\n` + series.map((s) => `${s.name}: ${s.values[k] == null ? "–" : Math.round(s.values[k] * 10) / 10}`).join("\n");

  });

    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map((s) => s.name).join(", "))}">${g}</svg>`;
}

  const W = 640, H = height, L = 36, R = 10, T = 12, B = 26; const iw = W - L - R, ih = H - T - B;
  const max = Math.max(1, ...series.flatMap((s) => s.values)); const nice = Math.ceil(max / 4) * 4;
  const y = (v) => T + ih - (v / nice) * ih; const gw = iw / labels.length; const bw = Math.min(28, (gw - 16) / series.length - 2);

  const recent = (db.recent[db.currentUserId] || []).map(issue).filter(Boolean);
  const overdue = mine.filter(isOverdue).length; const soon = mine.filter((i) => i.dueDate && !isOverdue(i) && daysBetween(today(), i.dueDate) <= 7).length;
  const tab = ui.yourWork; const list = tab === "assigned" ? mine : tab === "watched" ? watched : recent;

      <div class="card stat"><div class="v">${db.issues.filter((i) => i.assigneeId === db.currentUserId && i.resolvedAt && Date.now() - new Date(i.resolvedAt) < 7 * 864e5).length}</div><div class="l">erledigt in 7 Tagen</div></div>
    </div>
    <div class="tabs"><button class="${tab === "assigned" ? "on" : ""}" data-act="yw-tab" data-v="assigned">Mir zugewiesen (${mine.length})</button><button class="${tab === "watched" ? "on" : ""}" data-act="yw-tab" data-v="watched">Beobachtet (${watched.length})</button><button class="${tab === "recent" ? "on" : ""}" data-act="yw-tab" data-v="recent">Zuletzt angesehen</button></div>
    ${list.length ? Object.entries(grouped).map(([pid, l]) => `<div class="card pad" style="margin-bottom:14px"><div class="row" style="margin-bottom:6px"><span class="pavatar" style="background:${proj(pid).color};width:24px;height:24px;font-size:9px">${esc(proj(pid).key.slice(0, 3))}</span><a class="b" href="#/p/${proj(pid).key}">${esc(proj(pid).name)}</a></div>
      <div class="tbl-wrap"><table><tbody>${l.map((i) => issueRow(i, `<td style="width:30px">${avatar(i.assigneeId)}</td>`)).join("")}</tbody></table></div></div>`).join("")
      : `<div class="empty">${tab === "assigned" ? "Ihnen sind keine offenen Vorgänge zugewiesen. 🎉" : tab === "watched" ? "Sie beobachten keine offenen Vorgänge." : "Noch keine Vorgänge angesehen."}</div>`}`;
}

/* ---------- Ansicht: Board ---------- */
function boardIssues(p) {
  const b = ui.board; const sp = activeSprint(p);
  let list = projIssues(p).filter((i) => i.type !== "EPIC");
  if (p.type === "software") list = sp ? list.filter((i) => i.sprintId === sp.id) : [];
  else list = list.filter((i) => !(isDone(i) && i.resolvedAt && Date.now() - new Date(i.resolvedAt) > 14 * 864e5));
  if (b.mine) list = list.filter((i) => i.assigneeId === db.currentUserId);
  if (b.recent) list = list.filter((i) => Date.now() - new Date(i.updatedAt) < 864e5);
  if (b.users.length) list = list.filter((i) => b.users.includes(i.assigneeId || "none"));
  if (b.q) { const q = b.q.toLowerCase(); list = list.filter((i) => `${keyOf(i)} ${i.summary}`.toLowerCase().includes(q)); }
  return list.sort((a, c) => a.rank - c.rank);
}
function boardCard(i) {

    <div class="row nowrap">${typeIcon(i.type)}<span class="key">${keyOf(i)}</span><span class="sp"></span>${sla && !sla.stopped ? slaChip(sla) : ""}${dueChip(i)}${subtaskProgress(i)}${i.storyPoints != null ? `<span class="pts">${i.storyPoints}</span>` : ""}${prioIcon(i.priority)}${avatar(i.assigneeId)}</div></div>`;
}
function viewBoard(p) {

      ${sp ? `<div class="small muted">${fmtDay(sp.start)} – ${fmtDay(sp.end)} · noch ${Math.max(0, daysBetween(today(), sp.end))} Tage${sp.goal ? ` · Ziel: ${esc(sp.goal)}` : ""}</div>` : ""}</div>
      <div class="row">${sp ? `<button class="btn" data-act="complete-sprint" data-id="${sp.id}">Sprint abschließen</button>` : ""}<button class="btn primary" data-act="create" data-project="${p.id}">${icon("plus")} Vorgang</button></div></div>
    <div class="board-tools"><input type="search" id="board-q" placeholder="Board durchsuchen" value="${esc(b.q)}">
      <div class="avatars-filter">${assignees.map((a) => `<button class="${b.users.includes(a) ? "on" : ""}" data-act="board-user" data-v="${a}" aria-label="${esc(a === "none" ? "Nicht zugewiesen" : uname(a))}">${avatar(a === "none" ? null : a)}</button>`).join("")}</div>
      <button class="toggle ${b.mine ? "on" : ""}" data-act="board-toggle" data-v="mine">Nur meine</button><button class="toggle ${b.recent ? "on" : ""}" data-act="board-toggle" data-v="recent">Kürzlich aktualisiert</button>
      <span class="sp"></span><label class="small muted row nowrap">Gruppieren nach <select id="board-lane" style="width:auto">${[["none", "Keine"], ["assignee", "Verantwortlich"], ["epic", "Epic"], ["priority", "Priorität"]].map(([v, l]) => `<option value="${v}" ${b.lane === v ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>`;
  if (p.type === "software" && !sp) return head + `<div class="empty">Kein aktiver Sprint. Im <a href="#/p/${p.key}/backlog">Backlog</a> einen Sprint planen und starten.</div>`;

  if (b.lane === "epic") lanes = [...new Set(list.map((i) => i.epicId || (i.parentId && issue(i.parentId)?.epicId) || ""))].map((e) => ({ key: e, title: e ? `${typeIcon("EPIC")} ${esc(issue(e)?.summary)}` : "Ohne Epic", items: list.filter((i) => (i.epicId || (i.parentId && issue(i.parentId)?.epicId) || "") === e) }));

    <div class="board" style="grid-template-columns:repeat(${wf.length}, minmax(240px,1fr))">${wf.map((s) => { const col = ln.items.filter((i) => i.status === s.id);
      return `<div class="col" data-drop-status="${s.id}"><div class="col-h">${esc(s.name)} <span>${col.length}</span>${s.cat === "done" ? " ✓" : ""}</div>${col.map(boardCard).join("")}</div>`; }).join("")}</div>`).join("");

/* ---------- Ansicht: Backlog ---------- */

/* ---------- Ansicht: Zeitleiste ---------- */
function viewTimeline(p) {
  const start = addDays(today(), -21); const days = 140; const end = addDays(start, days);
  const pos = (k) => Math.max(0, Math.min(100, (daysBetween(start, k) / days) * 100));
  const months = []; let m = parseDay(start); m.setDate(1); while (dayKey(m) < end) { const k = dayKey(m); if (k >= start) months.push(k); m.setMonth(m.getMonth() + 1); }
  const epics = epicsOf(p).sort((a, b) => (a.startDate || a.createdAt).localeCompare(b.startDate || b.createdAt));
  const rows = epics.map((e) => {
    const ch = epicChildren(e); const done = ch.filter(isDone).length; const pct = ch.length ? Math.round(done / ch.length * 100) : 0;
    const s = e.startDate || dayKey(e.createdAt), en = e.dueDate || addDays(s, 30);
    const left = pos(s), width = Math.max(1.5, pos(en) - left);
    const open = ui.tlOpen?.includes(e.id);
    let html = `<div class="tl-name"><button class="btn subtle sm icon" data-act="tl-toggle" data-id="${e.id}" aria-label="Aufklappen" style="width:22px">${open ? "▾" : "▸"}</button>${typeIcon("EPIC")}<a href="#" data-act="open" data-id="${e.id}" class="trunc" style="color:var(--fg)">${esc(e.summary)}</a></div>
      <div class="tl-track"><div class="tl-bar" data-act="open" data-id="${e.id}" style="left:${left}%;width:${width}%;background:${e.color || "#8f5bd6"}" data-tip="${esc(`${e.summary}\n${fmtDay(s)} – ${fmtDay(en)}\n${done}/${ch.length} erledigt (${pct}%)`)}"><i style="width:${pct}%"></i>${pct}%</div></div>`;
    if (open) html += ch.map((c) => { const cs = dayKey(c.createdAt) < start ? start : dayKey(c.createdAt); const ce = c.dueDate || (c.resolvedAt ? dayKey(c.resolvedAt) : addDays(cs, 7)); const l = pos(cs);
      return `<div class="tl-name" style="padding-left:40px">${typeIcon(c.type)}<a href="#" data-act="open" data-id="${c.id}" class="trunc" style="color:var(--fg)">${keyOf(c)} ${esc(c.summary)}</a></div>
        <div class="tl-track"><div class="tl-bar" data-act="open" data-id="${c.id}" style="left:${l}%;width:${Math.max(1, pos(ce) - l)}%;background:${isDone(c) ? "var(--ok)" : "var(--ref)"};opacity:.85" data-tip="${esc(`${keyOf(c)} ${c.summary}\n${statusOf(c).name}`)}"></div></div>`; }).join("") || `<div class="tl-name small muted" style="padding-left:40px">Keine Vorgänge</div><div class="tl-track"></div>`;
    return html;
  }).join("");
  return `<div class="page-head"><div><div class="crumbs">Projekte / ${esc(p.name)}</div><h1>Zeitleiste</h1></div><button class="btn primary" data-act="create" data-project="${p.id}" data-type="EPIC">${icon("plus")} Epic</button></div>
    ${epics.length ? `<div class="card tl"><div class="tl-grid"><div class="tl-name b" style="height:30px;border-bottom:2px solid var(--border)">Epics</div>
      <div class="tl-head">${months.map((k) => `<span style="left:${pos(k)}%">${parseDay(k).toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</span>`).join("")}<div class="tl-today" style="left:${pos(today())}%" title="Heute"></div></div>
      ${rows}</div></div><p class="small muted" style="margin-top:8px">Balken: Start- bis Fälligkeitsdatum des Epics; heller Anteil = erledigte Vorgänge. Oranger Strich = heute.</p>`
      : `<div class="empty">Noch keine Epics. Epics bündeln größere Vorhaben – <a href="#" data-act="create" data-project="${p.id}" data-type="EPIC">jetzt Epic anlegen</a>.</div>`}`;
}

/* ---------- Ansicht: Liste & Filter ---------- */
function resultTable(list, { sortable = false, sortField = null, sortDir = "DESC" } = {}) {
  if (!list.length) return `<div class="empty">Keine Vorgänge gefunden.</div>`;
  const th = (f, l) => sortable ? `<th data-sort="${f}">${l}${sortField === f ? (sortDir === "ASC" ? " ↑" : " ↓") : ""}</th>` : `<th>${l}</th>`;
  return `<div class="card tbl-wrap"><table><thead><tr>${th("type", "Typ")}${th("key", "Schlüssel")}${th("summary", "Zusammenfassung")}${th("assignee", "Verantwortlich")}${th("status", "Status")}${th("priority", "Priorität")}${th("due", "Fällig")}${th("updated", "Aktualisiert")}</tr></thead><tbody>
    ${list.map((i) => `<tr class="click" data-act="open" data-id="${i.id}"><td>${typeIcon(i.type)}</td><td class="key">${keyOf(i)}</td><td><div class="trunc" style="max-width:440px">${esc(i.summary)}</div>${i.customer ? `<div class="small muted">${esc(i.customer.company || i.customer.name)}</div>` : ""}</td>
      <td><span class="row nowrap">${avatar(i.assigneeId)}<span class="trunc small">${esc(uname(i.assigneeId))}</span></span></td><td>${lozenge(i)}</td><td>${prioIcon(i.priority)}</td><td>${dueChip(i) || (i.dueDate ? `<span class="small muted">${fmtDay(i.dueDate)}</span>` : '<span class="muted">–</span>')}</td><td class="small muted" style="white-space:nowrap">${ago(i.updatedAt)}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function viewList(p) {
  const jql = `project = ${p.key} ORDER BY created DESC`;
  return `<div class="page-head"><div><div class="crumbs">Projekte / ${esc(p.name)}</div><h1>Liste</h1></div><div class="row"><a class="btn" href="#/filters?jql=${encodeURIComponent(jql)}">${icon("filter")} In Filter öffnen</a><button class="btn primary" data-act="create" data-project="${p.id}">${icon("plus")} Vorgang</button></div></div>
    <div class="card pad" style="margin-bottom:14px">${statusStack(projIssues(p).filter((i) => i.type !== "EPIC"))}</div>${resultTable(runJql(jql))}`;
}
function viewFilters(params) {
  const all = [...DEFAULT_FILTERS, ...db.filters];
  const fid = params.get("filter"); const f = all.find((x) => x.id === fid);
  const jql = params.get("jql") ?? f?.jql ?? DEFAULT_FILTERS[0].jql;
  let list = [], err = null; try { list = runJql(jql); } catch (e) { err = e.message; }
  let sortField = null, sortDir = "DESC"; try { const o = parseJql(jql).order[0]; if (o) { sortField = o.f; sortDir = o.dir; } } catch {}
  ui.lastResults = list;
  return `<div class="page-head"><h1>Vorgänge suchen</h1><div class="row"><button class="btn" data-act="save-filter">${icon("star")} Filter speichern</button><button class="btn" data-act="export-csv">${icon("download")} CSV / Excel</button></div></div>
    <div class="grid" style="grid-template-columns:220px minmax(0,1fr);align-items:start" id="filter-layout">
      <div class="card pad queue-nav"><div class="small b muted" style="margin-bottom:6px">STANDARDFILTER</div>${DEFAULT_FILTERS.map((x) => `<button class="${fid === x.id || (!fid && !params.get("jql") && x.id === "f-mine") ? "on" : ""}" data-act="goto" data-href="#/filters?filter=${x.id}">${esc(x.name)}</button>`).join("")}
        <div class="small b muted" style="margin:12px 0 6px">GESPEICHERT</div>${db.filters.length ? db.filters.map((x) => `<div class="row nowrap"><button class="${fid === x.id ? "on" : ""}" data-act="goto" data-href="#/filters?filter=${x.id}" style="flex:1">${esc(x.name)}</button><button class="btn subtle sm icon" data-act="delete-filter" data-id="${x.id}" aria-label="Filter löschen">${icon("x")}</button></div>`).join("") : '<p class="small muted" style="margin:0 10px">Noch keine.</p>'}</div>
      <div>
        <form id="jql-form" class="row nowrap" style="margin-bottom:8px;align-items:flex-start"><textarea id="jql" class="jql" rows="2" spellcheck="false" aria-label="JQL-Abfrage">${esc(jql)}</textarea><button class="btn primary" type="submit">${icon("search")} Suchen</button></form>
        <details style="margin-bottom:10px"><summary class="small muted" style="cursor:pointer">Hilfe zur Abfragesprache (JQL)</summary><div class="small muted" style="padding:8px 0;line-height:1.7">
          Felder: <code>project, type, status, statusCategory, assignee, reporter, priority, labels, sprint, due, created, updated, resolved, resolution, text, summary, epic, customer, points</code><br>
          Operatoren: <code>= != ~ !~ &lt; &gt; &lt;= &gt;= IN (…) NOT IN (…) IS EMPTY IS NOT EMPTY</code>, verknüpft mit <code>AND OR NOT ( )</code>, sortiert mit <code>ORDER BY feld ASC|DESC</code><br>
          Funktionen: <code>currentUser() openSprints() now() startOfWeek() endOfWeek() startOfMonth()</code>, relative Daten <code>-7d 14d 2w</code><br>
          Beispiel: <code>project = SD AND priority IN (Höchste, Hoch) AND resolution = Unresolved ORDER BY created DESC</code></div></details>
        ${err ? `<div class="note err" style="margin-bottom:10px">Abfragefehler: ${esc(err)}</div>` : `<p class="small muted" style="margin:0 0 8px">${list.length} Vorgang${list.length === 1 ? "" : "e"}${f ? ` · Filter „${esc(f.name)}“` : ""}</p>`}
        ${err ? "" : resultTable(list, { sortable: true, sortField, sortDir })}
      </div></div>`;
}

/* ---------- Ansicht: Warteschlangen (Service) ---------- */
const QUEUES = [
  { id: "open", name: "Alle offenen", fn: (i) => !isDone(i) },
  { id: "mine", name: "Mir zugewiesen", fn: (i) => !isDone(i) && i.assigneeId === db.currentUserId },
  { id: "unassigned", name: "Nicht zugewiesen", fn: (i) => !isDone(i) && !i.assigneeId },
  { id: "risk", name: "SLA gefährdet / verletzt", fn: (i) => !isDone(i) && ["first", "resolve"].some((k) => { const s = slaInfo(i, k); return s && !s.stopped && (s.risk || s.breached); }) },
  { id: "waiting", name: "Wartet auf Kunde", fn: (i) => i.status === "WAITING" },
  { id: "incidents", name: "Störungen", fn: (i) => !isDone(i) && i.type === "INCIDENT" },
  { id: "resolved", name: "Kürzlich gelöst", fn: (i) => isDone(i) && i.resolvedAt && Date.now() - new Date(i.resolvedAt) < 14 * 864e5 },
];
function viewQueue(p) {
  const items = projIssues(p).filter((i) => i.type !== "SUBTASK");
  const q = QUEUES.find((x) => x.id === ui.queue) || QUEUES[0];
  const list = items.filter(q.fn).sort((a, b) => { const sa = slaInfo(a, "resolve"), sb = slaInfo(b, "resolve"); return (sa?.stopped ? 1e15 : sa?.remaining ?? 1e15) - (sb?.stopped ? 1e15 : sb?.remaining ?? 1e15); });
  return `<div class="page-head"><div><div class="crumbs">Projekte / ${esc(p.name)}</div><h1>Warteschlangen</h1></div><div class="row"><a class="btn" href="#/portal/${p.key}">${icon("portal")} Kundenportal</a><button class="btn primary" data-act="create" data-project="${p.id}">${icon("plus")} Anfrage</button></div></div>
    <div class="grid" style="grid-template-columns:210px minmax(0,1fr);align-items:start" id="queue-layout">
      <div class="card pad queue-nav">${QUEUES.map((x) => { const n = items.filter(x.fn).length; return `<button class="${x.id === q.id ? "on" : ""}" data-act="queue" data-v="${x.id}"><span>${esc(x.name)}</span><span class="${x.id === "risk" && n ? "chip red" : "muted"}">${n}</span></button>`; }).join("")}
        <p class="small muted" style="margin:12px 10px 0">SLA-Ziele (Kalenderzeit): ${Object.entries(SLA).map(([k, v]) => `${PRIOS[k].label} ${v[0]} h / ${v[1] >= 24 ? v[1] / 24 + " T" : v[1] + " h"}`).join(" · ")}. „Wartet auf Kunde“ pausiert die Lösungszeit.</p></div>
      <div>${list.length ? `<div class="card tbl-wrap"><table><thead><tr><th>Typ</th><th>Schlüssel</th><th>Anfrage / Kunde</th><th>Erste Antwort</th><th>Lösung</th><th>Status</th><th>Prio.</th><th></th></tr></thead><tbody>
        ${list.map((i) => `<tr class="click" data-act="open" data-id="${i.id}"><td>${typeIcon(i.type)}</td><td class="key">${keyOf(i)}</td><td><div class="trunc" style="max-width:280px">${esc(i.summary)}</div><div class="small muted trunc" style="max-width:280px">${esc(i.customer?.company || "")}${i.customer?.name ? " · " + esc(i.customer.name) : ""} · ${ago(i.createdAt)}</div></td>
          <td>${slaChip(slaInfo(i, "first"))}</td><td>${slaChip(slaInfo(i, "resolve"))}</td><td>${lozenge(i)}</td><td>${prioIcon(i.priority)}</td><td>${avatar(i.assigneeId)}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">Keine Anfragen in dieser Warteschlange. 🎉</div>`}</div></div>`;
}

/* ---------- Ansicht: Berichte ---------- */
function createdResolvedChart(list, days = 30) {
  const labels = [], created = [], resolved = [];
  for (let d = days - 1; d >= 0; d--) { const k = addDays(today(), -d); labels.push(fmtShort(k)); created.push(list.filter((i) => dayKey(i.createdAt) === k).length); resolved.push(list.filter((i) => i.resolvedAt && dayKey(i.resolvedAt) === k).length); }
  const cum = (a) => a.reduce((acc, v) => { acc.push((acc.at(-1) || 0) + v); return acc; }, []);
  return lineChart({ labels, series: [{ name: "Erstellt", color: "var(--s1)", values: cum(created) }, { name: "Erledigt", color: "var(--s2)", values: cum(resolved) }], yLabel: "kumuliert, letzte 30 Tage" });
}
function workloadBars(list) {
  const open = list.filter((i) => !isDone(i) && i.type !== "EPIC");
  return hbars(activeUsers().map((u) => { const l = open.filter((i) => i.assigneeId === u.id); return { label: u.name, value: l.length, extra: `${l.filter(isOverdue).length} überfällig` }; })
    .concat([{ label: "Nicht zugewiesen", value: open.filter((i) => !i.assigneeId).length }]).filter((r) => r.value > 0).sort((a, b) => b.value - a.value), "");
}
function burndown(p) {
  const sp = activeSprint(p); if (!sp) return `<p class="muted">Kein aktiver Sprint.</p>`;
  const list = db.issues.filter((i) => i.sprintId === sp.id && i.type !== "SUBTASK"); const total = list.reduce((s, i) => s + (i.storyPoints || 0), 0);
  const n = daysBetween(sp.start, sp.end); const labels = [], ideal = [], actual = [];
  for (let d = 0; d <= n; d++) { const k = addDays(sp.start, d); labels.push(fmtShort(k)); ideal.push(total - (total / n) * d);
    actual.push(k > today() ? null : total - list.filter((i) => i.resolvedAt && dayKey(i.resolvedAt) <= k).reduce((s, i) => s + (i.storyPoints || 0), 0)); }
  return lineChart({ labels, series: [{ name: "Ideal", color: "var(--ref)", values: ideal, dash: true }, { name: "Verbleibend", color: "var(--s1)", values: actual }], yMax: Math.max(1, total), yLabel: "Story Points" });
}
function viewReports(p) {
  const list = projIssues(p);
  const closed = db.sprints.filter((s) => s.projectId === p.id && s.state === "closed").slice(-6);
  const open = list.filter((i) => !isDone(i) && i.type !== "EPIC");
  let svc = "";
  if (p.type === "service") {
    const reqs = list.filter((i) => i.type !== "SUBTASK"); const k = (kind) => { const done = reqs.map((i) => slaInfo(i, kind)).filter((s) => s && s.stopped); return done.length ? Math.round(done.filter((s) => s.met).length / done.length * 100) : null; };
    const fr = k("first"), rs = k("resolve"); const avgRes = (() => { const r = reqs.filter((i) => i.resolvedAt); return r.length ? fmtDur(r.reduce((s, i) => s + (new Date(i.resolvedAt) - new Date(i.createdAt)), 0) / r.length) : "–"; })();
    svc = `<div class="grid g4" style="margin-bottom:16px">
      <div class="card stat"><div class="v">${fr == null ? "–" : fr + " %"}</div><div class="l">SLA erste Antwort eingehalten</div></div>
      <div class="card stat"><div class="v">${rs == null ? "–" : rs + " %"}</div><div class="l">SLA Lösung eingehalten</div></div>
      <div class="card stat"><div class="v">${avgRes}</div><div class="l">Ø Lösungszeit</div></div>
      <div class="card stat"><div class="v">${reqs.filter((i) => !isDone(i)).length}</div><div class="l">offene Anfragen</div></div></div>
      <div class="card pad" style="margin-bottom:16px"><h3 style="font-size:15px;margin-bottom:10px">Anfragen nach Typ (letzte 30 Tage)</h3>${hbars(["INCIDENT", "MAINT", "SERVICE"].map((t) => ({ label: TYPES[t].label, value: reqs.filter((i) => i.type === t && Date.now() - new Date(i.createdAt) < 30 * 864e5).length })))}</div>`;
  }
  return `<div class="page-head"><div><div class="crumbs">Projekte / ${esc(p.name)}</div><h1>Berichte</h1></div></div>${svc}
    <div class="grid g2">
      ${p.type === "software" ? `<div class="card pad"><h3 style="font-size:15px">Burndown – ${esc(activeSprint(p)?.name || "kein Sprint")}</h3><p class="small muted" style="margin:2px 0 8px">Verbleibende Story Points je Tag gegenüber dem idealen Verlauf</p>${burndown(p)}</div>
      <div class="card pad"><h3 style="font-size:15px">Velocity</h3><p class="small muted" style="margin:2px 0 8px">Zugesagte und erledigte Story Points je abgeschlossenem Sprint${closed.length ? ` · Ø ${Math.round(closed.reduce((s, x) => s + (x.completed || 0), 0) / closed.length)} SP` : ""}</p>
        ${closed.length ? barChart({ labels: closed.map((s) => s.name.replace(/^.*?(Sprint)/, "$1")), series: [{ name: "Zugesagt", color: "var(--ref)", values: closed.map((s) => s.committed || 0) }, { name: "Erledigt", color: "var(--s1)", values: closed.map((s) => s.completed || 0) }] }) : '<p class="muted">Noch keine abgeschlossenen Sprints.</p>'}</div>` : ""}
      <div class="card pad"><h3 style="font-size:15px">Erstellt vs. erledigt</h3><p class="small muted" style="margin:2px 0 8px">Läuft „Erstellt“ davon, wächst der Rückstand.</p>${createdResolvedChart(list)}</div>
      <div class="card pad"><h3 style="font-size:15px">Arbeitslast</h3><p class="small muted" style="margin:2px 0 8px">Offene Vorgänge je Person</p>${workloadBars(list)}
        <h3 style="font-size:15px;margin-top:18px">Status der offenen Arbeit</h3><div style="margin-top:8px">${statusStack(list.filter((i) => i.type !== "EPIC"))}</div>
        <p class="small muted">${open.filter(isOverdue).length} überfällig · ${open.filter((i) => !i.assigneeId).length} nicht zugewiesen</p></div>
    </div>`;
}

/* ---------- Drag & Drop ---------- */
let dragId = null;
function bindDnD() {
  $$("[data-drag]").forEach((el) => {
    el.addEventListener("dragstart", (e) => { dragId = el.dataset.drag; e.dataTransfer.setData("text/plain", dragId); el.classList.add("dragging"); });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragId = null; $$(".drop-on,.drop-before").forEach((x) => x.classList.remove("drop-on", "drop-before")); });
  });
  $$("[data-drop-status]").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop-on"); });
    col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop-on"); });
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("drop-on"); const i = issue(e.dataTransfer.getData("text/plain"));
      if (i && i.status !== col.dataset.dropStatus) { updateIssue(i, { status: col.dataset.dropStatus }); render(); toast(`${keyOf(i)} → ${statusOf(i).name}`); } });
  });
  $$("[data-drop-sprint]").forEach((box) => {
    box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("drop-on"); const row = e.target.closest("[data-drop-row]"); $$(".drop-before").forEach((x) => x.classList.remove("drop-before")); if (row && row.dataset.dropRow !== dragId) row.classList.add("drop-before"); });
    box.addEventListener("dragleave", (e) => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop-on"); });
    box.addEventListener("drop", (e) => {
      e.preventDefault(); box.classList.remove("drop-on"); const i = issue(e.dataTransfer.getData("text/plain")); if (!i) return;
      const target = box.dataset.dropSprint === "backlog" ? null : box.dataset.dropSprint; const row = e.target.closest("[data-drop-row]");
      if (row && row.dataset.dropRow !== i.id) { const before = issue(row.dataset.dropRow); const prev = db.issues.filter((x) => x.rank < before.rank).sort((a, b) => b.rank - a.rank)[0]; i.rank = prev ? (prev.rank + before.rank) / 2 : before.rank - 1; }
      if ((i.sprintId || null) !== target) { updateIssue(i, { sprintId: target }); children(i).forEach((c) => (c.sprintId = target)); toast(`${keyOf(i)} → ${target ? sprint(target).name : "Backlog"}`); }
      save(); render();
    });
  });
}

function exportCsv(list, name) {

window.addEventListener("storage", (e) => { if (e.key === KEY) { db = load(); render(); } });
