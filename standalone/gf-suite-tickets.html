<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GF-Suite Tickets</title>
<meta name="description" content="Ticketsystem für Aufgaben, Projekte und Fristen – eigenständige Version, läuft komplett im Browser.">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1d2230; --muted: #6b7280; --border: #e3e6ec; --soft: #f1f3f6;
  --primary: #24306b; --primary-fg: #ffffff; --primary-soft: #e8ebf7;
  --danger: #c2343a; --danger-soft: #fbe9ea; --warn: #9a6200; --warn-soft: #fdf3dc; --ok: #1f7a4d; --ok-soft: #e3f4ea;
  --info: #2563a8; --info-soft: #e6eff9;
  --sidebar: #121726; --sidebar-fg: #d6dae4; --sidebar-muted: #7d8497; --sidebar-active: #222a40;
  --brand: linear-gradient(135deg, #24306b 0%, #463a8f 55%, #6a3e9e 100%);
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e111a; --card: #161b27; --fg: #e6e8ee; --muted: #9298a8; --border: #262d3d; --soft: #1d2333;
    --primary: #9fb0ff; --primary-fg: #10142a; --primary-soft: #232b4a;
    --danger: #ff8086; --danger-soft: #3a1d22; --warn: #f2c066; --warn-soft: #3a2f17; --ok: #6fd6a0; --ok-soft: #173326;
    --info: #8cbcf5; --info-soft: #1b2a40;
    --sidebar: #0a0d15; --sidebar-active: #1a2032; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e111a; --card: #161b27; --fg: #e6e8ee; --muted: #9298a8; --border: #262d3d; --soft: #1d2333;
  --primary: #9fb0ff; --primary-fg: #10142a; --primary-soft: #232b4a;
  --danger: #ff8086; --danger-soft: #3a1d22; --warn: #f2c066; --warn-soft: #3a2f17; --ok: #6fd6a0; --ok-soft: #173326;
  --info: #8cbcf5; --info-soft: #1b2a40;
  --sidebar: #0a0d15; --sidebar-active: #1a2032; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.app { display: flex; min-height: 100vh; }
/* Sidebar */
.sidebar { width: 240px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-fg); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.07); font-weight: 600; font-size: 15px; color: #fff; }
.brand-logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; }
.nav { padding: 14px 10px; overflow-y: auto; flex: 1; }
.nav-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--sidebar-muted); padding: 0 10px; margin: 14px 0 6px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: rgba(214,218,228,.75); font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.05); color: #fff; }
.nav a.active { background: var(--sidebar-active); color: #fff; }
.nav a .count { margin-left: auto; background: var(--danger); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 600; }
.nav svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .8; }
.sidebar-foot { padding: 12px 16px; font-size: 12px; color: var(--sidebar-muted); border-top: 1px solid rgba(255,255,255,.07); }
/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; }
.content { padding: 24px 28px 48px; max-width: 1400px; width: 100%; margin: 0 auto; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
.page-head h2 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
/* UI */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px; }
.card h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--soft); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.icon { padding: 7px; }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], input[type=email], input[type=date], input[type=search], select, textarea {
  border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus, .btn:focus-visible { outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 1px; }
label.field { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-info { background: var(--info-soft); color: var(--info); }
.b-primary { background: var(--primary-soft); color: var(--primary); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.avatar.lg { width: 40px; height: 40px; font-size: 13px; }
.stat { display: flex; align-items: center; gap: 14px; padding: 16px; }
.stat .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.stat .ico svg { width: 20px; height: 20px; }
.stat .val { font-size: 24px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.clickable { cursor: pointer; } .stat.clickable:hover { box-shadow: 0 4px 14px rgba(16,24,40,.1); }
.tone-danger .ico { background: var(--danger-soft); color: var(--danger); } .tone-danger .val { color: var(--danger); }
.tone-warn .ico { background: var(--warn-soft); color: var(--warn); }
.tone-ok .ico { background: var(--ok-soft); color: var(--ok); }
/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--soft); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--soft); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overdue { color: var(--danger); font-weight: 600; }
/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.filters > * { width: auto; }
.filters input[type=search] { width: 240px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
/* Kanban */
.kanban { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--soft); border-radius: 12px; padding: 10px; min-height: 220px; }
.col.drop { outline: 2px dashed var(--primary); }
.col-head { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; margin: 2px 4px 10px; }
.kcard { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow); }
.kcard:hover { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.kcard .t { font-weight: 600; margin: 2px 0 8px; line-height: 1.35; }
/* Lists */
.list-row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.list-row:last-child { border-bottom: 0; }
.list-row .main-col { flex: 1; min-width: 220px; cursor: pointer; }
.section-title { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; margin: 22px 0 8px; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; background: color-mix(in srgb, var(--soft) 50%, transparent); }
/* Bars */
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.mini-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; text-align: center; }
.mini-stats div { background: var(--soft); border-radius: 8px; padding: 7px 2px; }
.mini-stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.mini-stats span { font-size: 11px; color: var(--muted); }
.note { border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.info { background: var(--info-soft); color: var(--info); }
.note.danger { background: var(--danger-soft); color: var(--danger); }
/* Drawer & modal */
.overlay { position: fixed; inset: 0; background: rgba(10,14,25,.45); z-index: 40; display: none; }
.overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--card); z-index: 50; box-shadow: -8px 0 30px rgba(0,0,0,.18); transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); z-index: 1; }
.drawer-body { padding: 16px 20px 40px; display: grid; gap: 18px; }
.modal { position: fixed; z-index: 60; top: 50%; left: 50%; transform: translate(-50%,-50%); width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--card); border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,.25); padding: 22px; display: none; }
.modal.open { display: block; }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.kv label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.check-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.check-item.done span { text-decoration: line-through; color: var(--muted); }
.comment { display: flex; gap: 10px; }
.comment .bubble { background: var(--soft); border-radius: 10px; padding: 8px 12px; flex: 1; }
/* Popover */
.popover { position: absolute; top: 48px; right: 16px; width: min(380px, calc(100vw - 24px)); background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.18); z-index: 45; display: none; overflow: hidden; }
.popover.open { display: block; }
.notif { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notif:hover { background: var(--soft); }
.notif.unread { background: color-mix(in srgb, var(--primary-soft) 50%, transparent); }
.notif .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-top: 6px; flex-shrink: 0; }
.bell { position: relative; }
.bell .n { position: absolute; top: -3px; right: -3px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; border-radius: 99px; min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 4px; }
.dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); cursor: pointer; }
.dropzone.hover { border-color: var(--primary); background: var(--primary-soft); }
.toast-wrap { position: fixed; bottom: 18px; right: 18px; z-index: 80; display: grid; gap: 8px; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; max-width: 360px; }
svg.i { width: 16px; height: 16px; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 860px) {
  .sidebar { position: fixed; left: 0; z-index: 55; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-flex; }
  .content { padding: 18px 16px 40px; }
  .g2, .g3, .g4 { grid-template-columns: minmax(0,1fr); }
  .filters input[type=search] { width: 100%; }
  .filters > select { flex: 1 1 140px; }
  .kv { grid-template-columns: minmax(0,1fr); }
}
@media print { .sidebar, .topbar, .no-print { display: none !important; } .content { padding: 0; } }
</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-logo"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1M9 13h1m4 0h1M9 17h1m4 0h1"/></svg></div>GF-Suite Tickets</div>

</div>
<div class="overlay" id="overlay" data-act="close-all"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast-wrap" id="toasts"></div>

<script>

  const weekday = (new Date().getDay() + 6) % 7; const toSunday = 6 - weekday;

}

/* ---------- Benachrichtigungen ---------- */
function notify(userIds, type, title, message, ticketId, key) {
  const actor = db.currentUserId;
  [...new Set(userIds.filter(Boolean))].forEach((userId) => {
    if (!key && userId === actor) return;
    const k = key ? `${key}:${userId}` : null;
    if (k && db.notifications.some((n) => n.key === k)) return;
    db.notifications.unshift({ id: uid(), userId, type, title, message, ticketId, at: new Date().toISOString(), read: false, key: k });
  });
  db.notifications = db.notifications.slice(0, 500);
}
const label = (t) => `${ticketNo(t.no)} · ${t.title}`;
/** Fristen prüfen: bald fällig, überfällig (Eskalation an Ersteller), Vertretung bei Abwesenheit. */
function deadlineCheck() {
  const t0 = todayKey();
  db.tickets.filter((t) => isOpen(t) && t.dueDate).forEach((t) => {
    const owner = t.assigneeId || t.createdById; const d = diffDays(t.dueDate);
    if (d < 0) notify([owner, t.createdById], "UEBERFAELLIG", `Überfällig: ${label(t)}`, t.assigneeId ? "Frist abgelaufen – erledigen, neu terminieren oder neu zuweisen." : "Frist abgelaufen und niemandem zugewiesen.", t.id, `overdue:${t.id}:${t.dueDate}`);
    else if (d <= 2) notify([owner], "FRIST_BALD", `Frist läuft bald ab: ${label(t)}`, `Fällig ${relDue(t.dueDate)} (${fmtDate(t.dueDate)}).`, t.id, `soon:${t.id}:${t.dueDate}`);
    if (t.assigneeId && d >= 0 && d <= 7) {
      const a = absenceOn(t.assigneeId, t.dueDate);
      if (a) {
        let recipients = [t.createdById];
        if (t.createdById === t.assigneeId) recipients = db.users.filter((u) => u.role === "GESCHAEFTSFUEHRER" && u.active && u.id !== t.assigneeId).map((u) => u.id);
        notify(recipients, "VERTRETUNG", `Vertretung nötig: ${label(t)}`, `${userName(t.assigneeId)} ist am Fälligkeitstag nicht da (${absenceLabel(a)}).`, t.id, `absence:${t.id}:${a.id}:${t.dueDate}`);
      }
    }
  });
  void t0; save();
}

/* ---------- Ticket-Aktionen ---------- */
function logActivity(t, text) { t.activity.unshift({ at: new Date().toISOString(), userId: db.currentUserId, text }); }

    id: uid(), no: db.seq, title: data.title.trim(), desc: data.desc || "", status: data.status || "OFFEN", priority: data.priority || "MITTEL",

    category: data.category || "", checklist: (data.checklist || []).map((text) => ({ id: uid(), text, done: false })), comments: [],

  };
  logActivity(t, data.source ? "Ticket aus E-Mail erstellt" : "Ticket erstellt");
  db.tickets.push(t);
  if (t.assigneeId) notify([t.assigneeId], "ZUGEWIESEN", `Neues Ticket für Sie: ${label(t)}`, `${me().name} hat Ihnen dieses Ticket zugewiesen${t.dueDate ? ` (fällig ${fmtDate(t.dueDate)})` : ""}.`, t.id);
  deadlineCheck(); save(); return t;
}
function updateTicket(t, changes) {
  const before = { ...t };
  Object.assign(t, changes);
  if ("status" in changes && changes.status !== before.status) {
    t.completedAt = changes.status === "ERLEDIGT" ? new Date().toISOString() : null;
    logActivity(t, `Status: ${STATUS[before.status]} → ${STATUS[t.status]}`);
    notify([t.createdById, t.assigneeId], "STATUS", `${STATUS[t.status]}: ${label(t)}`, `${me().name} hat den Status auf „${STATUS[t.status]}“ gesetzt.`, t.id);
  }
  if ("assigneeId" in changes && changes.assigneeId !== before.assigneeId) {
    logActivity(t, `Zugewiesen an ${userName(t.assigneeId)}`);
    if (t.assigneeId) notify([t.assigneeId], "ZUGEWIESEN", `Ticket zugewiesen: ${label(t)}`, `${me().name} hat Ihnen dieses Ticket zugewiesen${t.dueDate ? ` (fällig ${fmtDate(t.dueDate)})` : ""}.`, t.id);
  }
  if ("dueDate" in changes && changes.dueDate !== before.dueDate) {
    logActivity(t, `Frist: ${fmtDate(before.dueDate)} → ${fmtDate(t.dueDate)}`);
    if (!("assigneeId" in changes && changes.assigneeId !== before.assigneeId)) notify([t.assigneeId], "STATUS", `Frist geändert: ${label(t)}`, t.dueDate ? `Neue Frist: ${fmtDate(t.dueDate)}.` : "Frist entfernt.", t.id);
  }
  if ("priority" in changes && changes.priority !== before.priority) logActivity(t, `Priorität: ${PRIO[before.priority]} → ${PRIO[t.priority]}`);
  if ("title" in changes && changes.title !== before.title) logActivity(t, "Titel geändert");
  deadlineCheck(); save();
}

}

function filteredTickets(scope) {
  const f = ui.filters; const q = f.q.trim().toLowerCase();
  const m = q.match(/^(?:#|t-?)(\d+)$/i);
  return db.tickets.filter((t) => {
    if (scope === "mine" && t.assigneeId !== db.currentUserId) return false;
    if (m) return t.no === Number(m[1]);
    if (q && !(`${t.title} ${t.desc} ${t.category}`.toLowerCase().includes(q))) return false;
    if (scope !== "mine" && f.assignee && (f.assignee === "__none" ? t.assigneeId : t.assigneeId !== f.assignee)) return false;
    if (f.status === "OPEN" ? !isOpen(t) : f.status && t.status !== f.status) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (f.project && t.projectId !== f.project) return false;
    return true;
  }).sort((a, b) => (isOpen(b) - isOpen(a)) || (a.dueDate || "9999").localeCompare(b.dueDate || "9999") || PRIO_POINTS[b.priority] - PRIO_POINTS[a.priority]);
}

    <select data-filter="project"><option value="">Alle Projekte</option>${db.projects.map((p) => `<option value="${p.id}" ${f.project === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
    ${Object.values(f).some(Boolean) ? `<button class="btn ghost" data-act="clear-filters">Filter zurücksetzen</button>` : ""}
  </div>`;
  const head = `<div class="page-head"><div><h2>${scope === "mine" ? "Meine Tickets" : "Alle Tickets"}</h2><p>${list.length} Ticket${list.length === 1 ? "" : "s"}${scope === "mine" ? " · Ihnen zugewiesen" : ""}</p></div>

/* ---------- E-Mail (.eml) einlesen ---------- */
function decodeWords(s) {
  return s.replace(/=\?([^?]+)\?([QB])\?([^?]*)\?=/gi, (_, cs, enc, txt) => {
    try {
      const bytes = enc.toUpperCase() === "B" ? Uint8Array.from(atob(txt), (c) => c.charCodeAt(0))
        : Uint8Array.from(txt.replace(/_/g, " ").replace(/=([0-9A-F]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16))), (c) => c.charCodeAt(0));
      return new TextDecoder(cs).decode(bytes);
    } catch { return txt; }
  });
}
function decodeBody(body, encoding, charset) {
  let bytes;
  if (/base64/i.test(encoding)) { try { bytes = Uint8Array.from(atob(body.replace(/\s+/g, "")), (c) => c.charCodeAt(0)); } catch { return body; } }
  else if (/quoted-printable/i.test(encoding)) bytes = Uint8Array.from(body.replace(/=\r?\n/g, "").replace(/=([0-9A-F]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16))), (c) => c.charCodeAt(0) & 255);
  else return body;
  try { return new TextDecoder(charset || "utf-8").decode(bytes); } catch { return new TextDecoder("utf-8").decode(bytes); }
}
function parseHeaders(block) {
  const h = {}; block.replace(/\r?\n[ \t]+/g, " ").split(/\r?\n/).forEach((line) => { const i = line.indexOf(":"); if (i > 0) h[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim(); });
  return h;
}
function splitPart(raw) { const m = raw.match(/\r?\n\r?\n/); return m ? [raw.slice(0, m.index), raw.slice(m.index + m[0].length)] : [raw, ""]; }
function extractText(headers, body) {
  const ct = headers["content-type"] || "text/plain"; const charset = (ct.match(/charset="?([^";]+)/i) || [])[1];
  const boundary = (ct.match(/boundary="?([^";]+)"?/i) || [])[1];
  if (/multipart\//i.test(ct) && boundary) {
    const parts = body.split("--" + boundary).slice(1).filter((p) => !p.startsWith("--"));
    let html = null;
    for (const p of parts) {
      const [hb, bb] = splitPart(p.replace(/^\r?\n/, "")); const ph = parseHeaders(hb);
      const pct = ph["content-type"] || "text/plain";
      if (/attachment/i.test(ph["content-disposition"] || "")) continue;
      if (/multipart\//i.test(pct)) { const r = extractText(ph, bb); if (r.text) return r; html = html || r.html; continue; }
      const decoded = decodeBody(bb, ph["content-transfer-encoding"] || "", (pct.match(/charset="?([^";]+)/i) || [])[1]);
      if (/text\/plain/i.test(pct)) return { text: decoded.trim() };
      if (/text\/html/i.test(pct)) html = decoded;
    }
    return { text: html ? htmlToText(html) : "", html };
  }
  const decoded = decodeBody(body, headers["content-transfer-encoding"] || "", charset);
  return { text: /text\/html/i.test(ct) ? htmlToText(decoded) : decoded.trim() };
}
function htmlToText(html) {
  const doc = new DOMParser().parseFromString(html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li|tr|h\d)>/gi, "\n"), "text/html");
  return (doc.body.textContent || "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
function parseEml(raw) {
  const [hb, body] = splitPart(raw); const h = parseHeaders(hb);
  const from = decodeWords(h.from || ""); const email = (from.match(/<([^>]+)>/) || from.match(/([\w.+-]+@[\w.-]+)/) || [])[1] || "";
  return { from, email, subject: decodeWords(h.subject || ""), date: h.date ? new Date(h.date) : null, text: extractText(h, body).text, high: /high|urgent|1/i.test(h["x-priority"] || h.importance || "") && !/normal|3/i.test(h["x-priority"] || "") };
}
function mailToTicket(mail) {
  const header = [mail.from && `Von: ${mail.from}`, mail.date && !isNaN(mail.date) && `Eingang: ${mail.date.toLocaleString("de-DE")}`].filter(Boolean).join("\n");
  ticketForm({ title: (mail.subject || "E-Mail ohne Betreff").replace(/^((re|aw|fw|fwd|wg):\s*)+/i, "").slice(0, 200), desc: [header, mail.text].filter(Boolean).join("\n\n").slice(0, 8000),
    priority: mail.high ? "HOCH" : "MITTEL", category: "E-Mail", source: { from: mail.from, email: mail.email, subject: mail.subject } });
}
function readFile(file, cb) { const r = new FileReader(); r.onload = () => cb(String(r.result)); r.readAsText(file, "utf-8"); }
function bindDropzone() {
  const dz = $("#dropzone"); if (!dz) return;
  ["dragenter", "dragover"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("hover"); }));
  ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, () => dz.classList.remove("hover")));
  dz.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f, (raw) => mailToTicket(parseEml(raw))); });
  $("#eml-input").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) readFile(f, (raw) => mailToTicket(parseEml(raw))); e.target.value = ""; });

/* ---------- CSV / JSON ---------- */
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type })); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportCsv() {
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Ticket", "Titel", "Status", "Priorität", "Verantwortlich", "Frist", "Projekt", "Kategorie", "Erstellt von", "Erstellt am", "Erledigt am", "Beschreibung"]]
    .concat(db.tickets.sort((a, b) => a.no - b.no).map((t) => [ticketNo(t.no), t.title, STATUS[t.status], PRIO[t.priority], t.assigneeId ? userName(t.assigneeId) : "", t.dueDate ? fmtDate(t.dueDate) : "", projectName(t.projectId), t.category, userName(t.createdById), fmtDateTime(t.createdAt), t.completedAt ? fmtDateTime(t.completedAt) : "", t.desc]));
  download(`tickets-${todayKey()}.csv`, "﻿" + rows.map((r) => r.map(q).join(";")).join("\r\n"), "text/csv;charset=utf-8");
}
function parseCsv(text) {
  const sep = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') inQ = false; else cell += c; }
    else if (c === '"') inQ = true; else if (c === sep) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function toKey(s) {
  s = (s || "").trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/); if (m) return `${m[3].length === 2 ? "20" + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}
function importAbsences(text) {
  const rows = parseCsv(text.replace(/^﻿/, "")); if (rows.length < 2) return toast("CSV enthält keine Daten.");
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const col = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
  const ci = { email: col("mail"), name: col("name", "mitarbeiter", "employee"), start: col("von", "start", "beginn", "from"), end: col("bis", "ende", "end", "finish", "to"), type: col("art", "typ", "type", "grund", "leave"), status: col("status", "genehm", "approved") };
  if (ci.start < 0) return toast("Spalte „Von/Start“ nicht gefunden.");
  let added = 0, skipped = 0;
  rows.slice(1).forEach((r) => {
    const email = ci.email >= 0 ? r[ci.email]?.trim().toLowerCase() : ""; const name = ci.name >= 0 ? r[ci.name]?.trim().toLowerCase() : "";
    const u = db.users.find((x) => (email && x.email.toLowerCase() === email) || (name && x.name.toLowerCase() === name));
    const start = toKey(r[ci.start]); const end = ci.end >= 0 ? toKey(r[ci.end]) || start : start;
    if (!u || !start) { skipped++; return; }
    const status = ci.status >= 0 ? (r[ci.status] || "").toLowerCase() : "";
    if (/abgelehnt|rejected|false/.test(status)) { skipped++; return; }
    const type = ci.type >= 0 && r[ci.type]?.trim() ? r[ci.type].trim() : "Abwesend";
    if (db.absences.some((a) => a.userId === u.id && a.start === start && a.end === end)) { skipped++; return; }
    db.absences.push({ id: uid(), userId: u.id, start, end, type, approved: !/ausstehend|pending|beantragt/.test(status) });
    added++;
  });
  deadlineCheck(); save(); render(); toast(`${added} Abwesenheiten importiert${skipped ? `, ${skipped} übersprungen (unbekannte Person/Datum/Duplikat)` : ""}`);
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act; const id = el.dataset.id; const t = id ? db.tickets.find((x) => x.id === id) : null;
  if (el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type !== "checkbox")) return;
  switch (act) {
    case "toggle-menu": $("#sidebar").classList.toggle("open"); break;
    case "toggle-theme": { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; try { localStorage.setItem(KEY + "-theme", document.documentElement.dataset.theme); } catch {} break; }
    case "toggle-notifs": { const p = $("#notifs"); p.classList.toggle("open"); if (p.classList.contains("open")) renderNotifs(); break; }
    case "read-all": db.notifications.forEach((n) => { if (n.userId === db.currentUserId) n.read = true; }); save(); renderNotifs(); renderNav(); break;
    case "open-notif": { const n = db.notifications.find((x) => x.id === id); if (n) { n.read = true; save(); $("#notifs").classList.remove("open"); renderNav(); if (n.ticketId) openTicket(n.ticketId); } break; }
    case "close-all": e.preventDefault(); closeAll(); break;
    case "goto": location.hash = el.dataset.href; break;
    case "new-ticket": ticketForm(); break;
    case "open-ticket": if (e.target.closest("select, button:not([data-act=open-ticket]), a")) return; openTicket(id); break;
    case "ticket-view": ui.ticketView = el.dataset.v; render(); break;
    case "clear-filters": ui.filters = { q: "", assignee: "", status: "", priority: "", project: "" }; render(); break;
    case "deadline-scope": ui.deadlineScope = el.dataset.v; render(); break;
    case "filter-assignee": ui.filters = { q: "", assignee: id, status: "OPEN", priority: "", project: "" }; if (route() === "tickets") render(); break;
    case "filter-project": ui.filters = { q: "", assignee: "", status: "", priority: "", project: id }; if (route() === "tickets") render(); break;
    case "done": if (t) { updateTicket(t, { status: "ERLEDIGT" }); render(); toast(`${ticketNo(t.no)} erledigt ✓`); } break;
    case "set-status": e.preventDefault(); if (t) { updateTicket(t, { status: el.dataset.v }); render(); } break;
    case "delete-ticket": if (t && confirm(`${ticketNo(t.no)} „${t.title}“ wirklich löschen?`)) { db.tickets = db.tickets.filter((x) => x.id !== t.id); db.notifications = db.notifications.filter((n) => n.ticketId !== t.id); save(); closeAll(); render(); toast("Ticket gelöscht"); } break;
    case "check": { const tk = db.tickets.find((x) => x.id === ui.openTicket); const c = tk?.checklist.find((x) => x.id === id); if (c) { c.done = el.checked; save(); renderDrawer(); } break; }
    case "del-check": { const tk = db.tickets.find((x) => x.id === ui.openTicket); if (tk) { tk.checklist = tk.checklist.filter((x) => x.id !== id); save(); renderDrawer(); } break; }
    case "add-check": { const tk = db.tickets.find((x) => x.id === ui.openTicket); const v = $("#new-check").value.trim(); if (tk && v) { tk.checklist.push({ id: uid(), text: v, done: false }); save(); renderDrawer(); $("#new-check")?.focus(); } break; }
    case "add-comment": { const tk = db.tickets.find((x) => x.id === ui.openTicket); const v = $("#new-comment").value.trim(); if (tk && v) {
      tk.comments.push({ id: uid(), userId: db.currentUserId, text: v, at: new Date().toISOString() }); logActivity(tk, "Kommentar hinzugefügt");
      notify([tk.assigneeId, tk.createdById, ...tk.comments.map((c) => c.userId)], "KOMMENTAR", `Neuer Kommentar: ${label(tk)}`, `${me().name}: ${v.slice(0, 140)}`, tk.id); save(); render(); } break; }
    case "mail-to-ticket": { const subject = $("#mail-subject").value.trim(), body = $("#mail-body").value.trim(), from = $("#mail-from").value.trim();
      if (!subject && !body) return toast("Bitte Betreff oder Text eingeben.");
      mailToTicket({ from, email: (from.match(/<([^>]+)>/) || from.match(/([\w.+-]+@[\w.-]+)/) || [])[1] || "", subject, text: body, date: new Date() }); break; }
    case "pick-eml": $("#eml-input").click(); break;
    case "new-project": { const name = prompt("Name des Projekts:"); if (name?.trim()) { db.projects.push({ id: uid(), name: name.trim() }); save(); render(); } break; }
    case "delete-project": if (confirm("Projekt löschen? Die Tickets bleiben erhalten.")) { db.projects = db.projects.filter((p) => p.id !== id); db.tickets.forEach((x) => { if (x.projectId === id) x.projectId = null; }); save(); render(); } break;
    case "add-user": { const name = $("#new-user-name").value.trim(), email = $("#new-user-email").value.trim().toLowerCase();
      if (!name || !/^\S+@\S+\.\S+$/.test(email)) return toast("Bitte Name und gültige E-Mail angeben.");
      if (db.users.some((u) => u.email.toLowerCase() === email)) return toast("Diese E-Mail ist bereits vorhanden.");
      db.users.push({ id: uid(), name, email, role: $("#new-user-role").value, active: true }); save(); render(); toast(`${name} hinzugefügt`); break; }
    case "user-active": { const u = userById(id); if (u) { u.active = el.checked; save(); render(); } break; }
    case "add-absence": { const s = $("#abs-start").value, en = $("#abs-end").value || s; if (!s) return; if (en < s) return toast("„Bis“ liegt vor „Von“.");
      db.absences.push({ id: uid(), userId: $("#abs-user").value, start: s, end: en, type: $("#abs-type").value, approved: true }); deadlineCheck(); save(); render(); toast("Abwesenheit gespeichert"); break; }
    case "toggle-absence": { const a = db.absences.find((x) => x.id === id); if (a) { a.approved = !a.approved; deadlineCheck(); save(); render(); } break; }
    case "delete-absence": db.absences = db.absences.filter((x) => x.id !== id); save(); render(); break;
    case "pick-absence-csv": $("#abs-csv").click(); break;
    case "export-csv": exportCsv(); break;
    case "export-json": download(`gf-suite-sicherung-${todayKey()}.json`, JSON.stringify(db, null, 2), "application/json"); break;
    case "pick-json": $("#json-input").click(); break;
    case "reset-demo": if (confirm("Alle Daten durch Demo-Daten ersetzen?")) { db = seed(); deadlineCheck(); save(); closeAll(); render(); } break;
    case "reset-empty": if (confirm("Wirklich ALLE Tickets, Projekte, Abwesenheiten und Benachrichtigungen löschen? (Team bleibt erhalten)")) {
      db = { ...db, tickets: [], projects: [], absences: [], notifications: [], seq: 0 }; save(); closeAll(); render(); } break;
  }
});
document.addEventListener("change", (e) => {
  const el = e.target; const act = el.dataset.act; const id = el.dataset.id;
  if (el.id === "user-switch") { db.currentUserId = el.value; save(); closeAll(); render(); toast(`Angemeldet als ${me().name}`); return; }
  if (el.dataset.filter) { ui.filters[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.field && ui.openTicket) {
    const t = db.tickets.find((x) => x.id === ui.openTicket); if (!t) return;
    let v = el.value; if (el.dataset.field === "title" && !v.trim()) { el.value = t.title; return; }
    if (["assigneeId", "dueDate", "projectId"].includes(el.dataset.field)) v = v || null;
    updateTicket(t, { [el.dataset.field]: v }); render(); return;
  }
  if (act === "assign") { const t = db.tickets.find((x) => x.id === id); if (t) { updateTicket(t, { assigneeId: el.value || null }); render(); toast(el.value ? `Zugewiesen an ${userName(el.value)}` : "Zuweisung entfernt"); } }
  if (act === "postpone" && el.value) { const t = db.tickets.find((x) => x.id === id); if (t) { postpone(t, Number(el.value)); render(); toast(`Frist verschoben auf ${fmtDate(t.dueDate)}`); } }
  if (act === "user-role") { const u = userById(id); if (u) { u.role = el.value; save(); render(); } }
  if (el.id === "abs-csv" && el.files[0]) { readFile(el.files[0], importAbsences); el.value = ""; }
  if (el.id === "json-input" && el.files[0]) { readFile(el.files[0], (raw) => { try { const data = JSON.parse(raw);
      if (!Array.isArray(data.tickets) || !Array.isArray(data.users)) throw new Error();
      if (confirm("Aktuelle Daten durch die Sicherung ersetzen?")) { db = data; save(); closeAll(); render(); toast("Sicherung geladen"); } } catch { toast("Ungültige Sicherungsdatei."); } }); el.value = ""; }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.filter === "q") { ui.filters.q = e.target.value; const pos = e.target.selectionStart; render(); const s = $('[data-filter="q"]'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeAll();
  if (e.key === "Enter" && e.target.id === "new-check") { e.preventDefault(); $('[data-act="add-check"]').click(); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "new-comment") $('[data-act="add-comment"]').click();
  if (e.key === "n" && !e.ctrlKey && !e.metaKey && !["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) && !$("#modal").classList.contains("open")) { e.preventDefault(); ticketForm(); }
});
document.addEventListener("click", (e) => { if (!e.target.closest("#notifs, #bell")) $("#notifs").classList.remove("open"); }, true);
window.addEventListener("hashchange", () => { $("#sidebar").classList.remove("open"); render(); });
window.addEventListener("storage", (e) => { if (e.key === KEY) { db = loadDb(); render(); } });

/* ---------- Start ---------- */
try { const th = localStorage.getItem(KEY + "-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
deadlineCheck();
render();
setInterval(() => { deadlineCheck(); renderNav(); }, 60000);
</script>
</body>
</html>
