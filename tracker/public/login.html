<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden · GF Tracker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c66e4">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GF Tracker">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .login { width: min(400px, 100%); padding: 28px; }
  .login h1 { font-size: 22px; margin: 14px 0 4px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 16px 0 12px; } .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .ms-btn { width: 100%; height: 38px; justify-content: center; gap: 10px; font-weight: 600; }
</style>
</head>
<body>
<main class="card login">
  <div class="logo"><span class="mark"><img src="/favicon.svg" alt="" width="28" height="28"></span>GF Tracker</div>
  <h1>Anmelden</h1>
  <p class="muted" style="margin:0 0 18px">Melden Sie sich mit Ihrer geschäftlichen E-Mail-Adresse an.</p>
  <form id="login" class="grid" style="gap:12px">
    <label class="f">E-Mail<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label class="f">Passwort<input type="password" name="password" autocomplete="current-password" required></label>
    <div id="err" class="note err" hidden></div>
    <button class="btn primary" type="submit" style="height:38px">Anmelden</button>
  </form>
  <div id="sso" hidden><div class="or"><span>oder</span></div><a class="btn ms-btn" href="/auth/microsoft"><svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>Mit Microsoft anmelden</a></div>
  <p class="small muted" style="margin:18px 0 0">Passwort vergessen? Bitte an die Administration wenden.<br>Kunden: <a href="/portal">zum Service-Portal</a></p>
</main>
<script src="/login.js"></script>
</body>
</html>
