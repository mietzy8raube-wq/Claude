# Produktivbetrieb: GF Tracker + Caddy (automatisches HTTPS über Let's Encrypt)
# Start:   docker compose up -d --build
# Logs:    docker compose logs -f tracker
services:
  tracker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data          # Datenbank + nächtliche Sicherungen (data/backups)
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # Interner Server: CADDYFILE=Caddyfile.intern-zertifikat oder Caddyfile.intern-ca in .env (siehe INBETRIEBNAHME.md)
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro     # nur für Caddyfile.intern-zertifikat: zertifikat.pem + schluessel.pem
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tracker
volumes:
  caddy_data:
  caddy_config:
